[build]
command = "pnpm build && pnpm check:site"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

# Versions Markdown et index llms.txt : forcer l’UTF-8 pour les accents.
[[headers]]
for = "/*.md"
[headers.values]
Content-Type = "text/markdown; charset=utf-8"

[[headers]]
for = "/llms.txt"
[headers.values]
Content-Type = "text/plain; charset=utf-8"
