 <path d="M706 207V468H948V221" fill="#faf9f3" stroke="#354335" stroke-width="3"/>
 <path d="M706 451H948" stroke="#354335" stroke-width="3"/>
 <rect x="875" y="240" width="40" height="44" rx="2" fill="#e8eee5" stroke="#354335" stroke-width="2"/>
 <path d="M895 240V284M875 262H915" stroke="#354335" stroke-width="2"/>
 <!-- Meter chamber -->
 <path d="M86 301V406H235V301" fill="#faf9f3" stroke="#354335" stroke-width="3"/>
 <rect x="77" y="291" width="166" height="12" rx="3" fill="#d8dfd0" stroke="#354335" stroke-width="2"/>
 <path d="M87 345H115M179 345H216" stroke="#354335" stroke-width="10" fill="none"/>
 <rect x="115" y="330" width="64" height="31" rx="7" fill="#e4e9df" stroke="#354335" stroke-width="3"/>
 <circle cx="147" cy="341" r="17" fill="#faf9f3" stroke="#354335" stroke-width="3"/>
 <path d="M138 345 147 334 151 339" fill="none" stroke="#354335" stroke-width="2"/>
 <!-- Bedding, mesh and continuous pipe -->
 <path d="M218 348V429H706V379H272V348Z" fill="url(#sand)"/>
 <rect x="277" y="337" width="410" height="16" fill="url(#mesh)"/>
 <path d="M208 345H237Q247 345 247 356V390Q247 404 263 404H833Q846 404 846 390V329" fill="none" stroke="#29392e" stroke-width="15" stroke-linecap="round"/>
 <path d="M208 345H237Q247 345 247 356V390Q247 404 263 404H833Q846 404 846 390V329" fill="none" stroke="#53a2bf" stroke-width="4" stroke-linecap="round"/>
 <!-- Wall sleeve surrounds pipe -->
 <path d="M682 388H731V420H682M682 388V398M682 410V420" fill="none" stroke="#354335" stroke-width="3"/>
 <path d="M697 388V399M697 410V420M716 388V399M716 410V420" stroke="#a0ac96" stroke-width="5"/>
 <!-- Internal valve -->
 <rect x="835" y="348" width="22" height="27" rx="3" fill="#e5d8b8" stroke="#354335" stroke-width="2"/>
 <path d="M846 349V340M831 340H861" stroke="#354335" stroke-width="4" stroke-linecap="round"/>
 <!-- Direction arrows -->
 <path d="M324 403H375M481 403H532M601 403H652" stroke="#2e83a3" stroke-width="2.5" marker-end="url(#arrow)"/>
 <!-- Simple labels -->
 <circle cx="70" cy="201" r="17" fill="#354335"/><text x="70" y="207" text-anchor="middle" fill="white" font-size="17">1</text>
 <text x="98" y="207" font-size="19" font-weight="700">Compteur</text>
 <text x="98" y="232" font-size="15" fill="#697b5d">Départ après compteur</text>
 <path d="M147 243V278" stroke="#7d8875" stroke-width="1.5"/>
 <circle cx="363" cy="227" r="17" fill="#354335"/><text x="363" y="233" text-anchor="middle" fill="white" font-size="17">2</text>
 <text x="390" y="233" font-size="19" font-weight="700">Tube PEHD</text>
 <text x="390" y="258" font-size="15" fill="#697b5d">Polyéthylène haute densité</text>
 <text x="755" y="207" font-size="19" font-weight="700">Maison</text>
 <circle cx="780" cy="310" r="17" fill="#354335"/><text x="780" y="316" text-anchor="middle" fill="white" font-size="17">3</text>
 <text x="807" y="307" font-size="16" font-weight="700">Vanne</text><text x="807" y="326" font-size="16">d’arrêt</text>
 <path d="M369 338V322H504" fill="none" stroke="#468eae" stroke-width="1.5"/>
 <text x="373" y="315" font-size="14" fill="#327794">Grillage avertisseur bleu</text>
 <path d="M447 425V450" stroke="#8d8062" stroke-width="1.5"/>
 <text x="375" y="473" font-size="15">Lit de sable</text>
 <path d="M709 423V494H774" fill="none" stroke="#7d8875" stroke-width="1.5"/>
 <text x="782" y="499" font-size="15">Fourreau étanche</text>
 <path d="M45 527H955" stroke="#d7ddcf"/>
 <text x="45" y="558" font-size="16" font-weight="700">À retenir</text>
 <text x="170" y="558" font-size="16">Eau potable · Pose hors gel · Contrôle avant de reboucher</text>
 <text x="45" y="591" font-size="13" fill="#697b5d">Schéma de principe, sans échelle : profondeur et diamètre à adapter au terrain.</text>
</g>
</svg>
