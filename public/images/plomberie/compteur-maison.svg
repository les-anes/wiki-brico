<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Du compteur à la maison</title>
<desc id="desc">Vue de principe : le tube PEHD part de la sortie privée du compteur, chemine enterré dans un lit de sable sous un grillage avertisseur bleu, traverse le mur dans un fourreau et rejoint une vanne d’arrêt dans la maison. Les dimensions sont à adapter au terrain.</desc>
<defs>
 <pattern id="sand" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#f1e8d4"/><circle cx="4" cy="5" r="1" fill="#cabc9d"/><circle cx="13" cy="13" r="1" fill="#cabc9d"/></pattern>
 <pattern id="mesh" width="20" height="16" patternUnits="userSpaceOnUse"><path d="M0 0 20 16M0 16 20 0" stroke="#468eae" stroke-width="1.5"/></pattern>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#2e83a3" stroke-width="1.8"/></marker>
</defs>
<rect width="1000" height="620" rx="20" fill="#faf9f3"/>
<g font-family="Arial, sans-serif" fill="#29392e">
 <text x="45" y="49" font-size="13" letter-spacing="2.5" fill="#697b5d">LE PRINCIPE EN UN COUP D’ŒIL</text>
 <text x="45" y="90" font-size="30" font-weight="700">Du compteur à la maison</text>
 <text x="45" y="118" font-size="16" fill="#697b5d">Un tube continu, enterré et protégé.</text>
