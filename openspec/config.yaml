schema: spec-driven

context: |
  Language: French
  All artifacts must be written in French.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  WikiBrico est une encyclopédie française du DIY et de la rénovation.
  Stack : React 19, TypeScript, Vite 6, Tailwind CSS 3, composants de style shadcn/ui.
  Application statique pré-rendue, sans backend. Routes réelles : /, /tutoriels/ et /tutoriel/<id>/ ; 404.html sinon.
  Les anciens liens à fragment (/#tutoriel/<id>, /#tutoriels) sont redirigés vers ces URLs par un court script en ligne.
  Routage dans src/lib/routes.ts ; document HTML dans src/document.tsx.
  Tutoriels JSON importés récursivement depuis src/data/tutorials/.
  Contrat : src/types.ts. Taxonomie : src/data/categories.json.
  Un fichier par tutoriel, classé par catégorie principale et topicPath en slugs.
  Préserver les identifiants, liens et favoris lors des reclassements.
  relatedCategories et journeys offrent plusieurs chemins sans dupliquer les JSON.
  Référence commune obligatoire pour créer ou réviser une fiche : openspec/specs/page-tutoriel/spec.md.
  Suivi éditorial : consulter docs/tutos-a-implementer.md avant de proposer un nouveau tuto et mettre à jour son avancement à chaque création de fiche ou changement de priorité.
  Objectif DIY : guider la réalisation et les contrôles autonomes, sans renvoi à un professionnel de la discipline ; conserver les prérequis de sécurité et les conditions d’arrêt.
  Les contenus documentés conservent un périmètre, des sources de recherche et une origine d’image.
  Une synthèse documentée ne constitue pas une validation professionnelle.
  Vérifications disponibles : pnpm validate:data, pnpm check:site, pnpm build.
  Les specs initiales décrivent le socle existant ; elles ne recensent pas toutes les fonctionnalités.

rules:
  proposal:
    - Expliquer le besoin utilisateur et le périmètre de la modification.
  specs:
    - Décrire les comportements observables avec des scénarios vérifiables.
  design:
    - Réutiliser les composants, types et conventions du projet.
    - Pour les contenus techniques, consulter des sources primaires et expliciter les limites.
  tasks:
    - Inclure les validations pertinentes ; adapter les contrôles existants si nécessaire.
