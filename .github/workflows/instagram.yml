name: Publication Instagram

# Une fiche par jour, puis l’état est enregistré dans le dépôt : c’est ce fichier
# qui garantit qu’une fiche n’est pas publiée deux fois.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      nombre:
        description: Nombre de fiches à publier
        default: "1"
      sansStory:
        description: Ne publier que le post, sans story
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # sharp sert à fabriquer les visuels quand la réserve est épuisée : on
      # installe donc aussi les dépendances de développement.
      - run: pnpm install --frozen-lockfile

      - name: Montrer la file d’attente
        run: pnpm instagram --plan

      # Cas courant : la réserve de visuels préparée d’avance est déjà déployée.
      - name: Vérifier si les visuels du jour sont en ligne
        id: pret
        run: |
          if pnpm instagram --check >/dev/null 2>&1; then
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          else
            echo "pret=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucun visuel prêt en ligne : l’action en fabrique un, le pousse, puis laisse le déploiement passer."
          fi

      # Réserve épuisée : on fabrique les deux visuels de la prochaine fiche et
      # on les pousse, pour que Netlify les serve au déploiement suivant.
      - name: Fabriquer les visuels manquants
        if: steps.pret.outputs.pret == 'non'
        run: pnpm instagram --media --limit 1

      - name: Pousser les visuels
        if: steps.pret.outputs.pret == 'non'
        run: |
          git config user.name "wikibrico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/images/social
          git diff --cached --quiet || git commit -m "chore(instagram): visuels du jour"
          git pull --rebase --autostash
          git push

      # Meta ne peut télécharger que ce que le site sert déjà : on lui laisse le
      # temps du déploiement, une dizaine de minutes au plus.
      - name: Attendre le déploiement
        if: steps.pret.outputs.pret == 'non'
        run: pnpm instagram --check --attendre 10

      - name: Publier
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          SITE_URL: https://wikibrico.fr
        run: pnpm instagram --publish --limit ${{ github.event.inputs.nombre || 1 }} ${{ github.event.inputs.sansStory == 'true' && '--sans-story' || '' }}

      # La publication a pu s’interrompre : l’état est écrit après chaque étape,
      # donc on enregistre ce qui a été publié, même en cas d’échec plus haut.
      - name: Enregistrer l’état
        if: always()
        run: |
          git config user.name "wikibrico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/instagram/publications.json
          git diff --cached --quiet || git commit -m "chore(instagram): noter les publications du jour"
          git pull --rebase --autostash
          git push
